# Perfil ativado pelo grupo 'docker' (ver application.yaml): base + development-env + docker-env.
# Como development-env vem antes, aqui so muda o que tem endereco diferente dentro da rede
# do compose - clientes, issuer, TTLs e sessao continuam herdados de la.
#
# A PORTA E 5432, NAO 5433. A 5433 e a porta PUBLICADA no host (ports: 5433:5432 no
# docker-compose.tools.yml); dentro da rede do compose o Postgres escuta na 5432 de sempre.
# Publicar porta nao muda a porta do servico - so cria um atalho pela maquina de fora.
spring:
  mail:
    # dentro da rede do compose, localhost e o proprio container; o mailpit atende
    # pelo nome do servico
    host: algashop-mailpit
  datasource:
    url: jdbc:postgresql://algashop-postgres:5432/authorization_server
  jpa:
    show-sql: true
  flyway:
    # db/testdata precisa estar aqui tambem: e onde vive o afterMigrate.sql que faz o
    # seed dos usuarios de teste e das tabelas de scope por papel. Sem ele, um ambiente
    # docker do zero sobe sem nenhum usuario e as mudancas de seed nunca sao aplicadas.
    locations: classpath:db/migration,classpath:db/testdata
    user: postgres
    password: postgres
    url: jdbc:postgresql://algashop-postgres:5432/authorization_server