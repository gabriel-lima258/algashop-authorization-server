# Clientes registrados no authorization server.
#
# O Spring Authorization Server le tudo abaixo de spring.security.oauth2.authorizationserver.client
# e monta um RegisteredClientRepository EM MEMORIA. Nao existe tabela, nao existe cadastro
# por API: quem entra aqui existe, quem sai daqui deixa de existir na proxima subida.

# - client_credentials: fluxo de maquina para maquina. Nao ha usuario
# - client-authentication-methods: Como o cliente prova quem e: client_secret_basic manda client-id e segredo no header
# - client_secret: vem do Parameter Store (SecureString) com prefixo {bcrypt} - hash, nao texto puro.
# O {noop} do PasswordEncoderConfig ("sem hash") ficou so como fallback historico.
# - scopes: sao o teto do que este token pode fazer - e nada alem disso. Este
# cliente e o de teste manual, entao carrega leitura e escrita.

# config.import traz os secrets e parameters da aws para o arquivo este arquivo env, através de importação feita no etc/aws/init.sh
# prefix é usado para importar os valores de forma facil ex: ${auth.secrets.datasource}

spring:
  config:
    import:
      - aws-secretsmanager:/secret/algashop/authorization-server/database?prefix=auth.secrets.datasource.
      - aws-secretsmanager:/config/algashop/authorization-server/rsa-key?prefix=jwk.
      - aws-parameterstore:/config/algashop/authorization-server?prefix=auth.params
      - aws-parameterstore:/config/algashop/shared?prefix=shared.params
  cloud:
    aws:
      region:
        static: us-east-1
      endpoint: http://algashop-localstack:4566
      credentials:
        access-key: LSIAQAAAAAAVNCBMPNSG
        secret-key: test
  mail:
    host: ${auth.params.mail.host}
    port: ${auth.params.mail.port}
  session: # configuração de sessão de usuários via db
    store-type: jdbc
    timeout: 30m
  datasource:
    url: ${auth.params.datasource.url}
    username: ${auth.secrets.datasource.username}
    password: ${auth.secrets.datasource.password}
  jpa:
    show-sql: ${auth.params.jpa.show-sql}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/testdata
    user: postgres
    password: postgres
    url: jdbc:postgresql://localhost:5433/authorization_server
  security:
    oauth2:
      authorizationserver:
        issuer: ${shared.params.auth-server-url} # validando url de acesso entre auth -> resource server
        client:
          algashop-test-client:
            registration:
              client-id: algashop-test
              authorization-grant-types:
                - client_credentials
              client-authentication-methods:
                - client_secret_basic
              client_secret: ${auth.params.clients.algashop-test.secret}
              scopes: # granulização de scopes (permissão de acesso ao sistema)
                - products:read
                - products:write
                - products:stock:write
                - categories:read
                - categories:write
                - invoices:read
                - invoices:write
                - credit-cards:read
                - credit-cards:write
                - orders:read
                - orders:write
                - customers:read
                - customers:write
                - shopping-carts:read
                - shopping-carts:write
                - shipping-costs:preview
                - users:read
                - users:write
            token:
              access-token-time-to-live: 15m # tempo de expiração token
              # Era 'reference' (opaco) e virou JWT na Fase 21: os resource servers foram
              # configurados com .jwt(), que so sabe validar token auto-contido. Token opaco
              # exigiria introspeccao, que nenhum deles faz.
              access-token-format: self-contained
          algashop-ordering-service-client:
            registration:
              client-id: algashop-ordering-service
              authorization-grant-types:
                - client_credentials
              client-authentication-methods:
                - client_secret_basic
              client_secret: ${auth.params.clients.algashop-ordering-service.secret}
              scopes:
                - products:read
            token:
              access-token-time-to-live: 5m
              access-token-format: self-contained # JWT, validado localmente pela chave publica
          # O CLIENT WEB - o primeiro do projeto com usuario de verdade no fluxo.
          algashop-ecommerce-web-client:
            registration:
              client-id: algashop-ecommerce-web
              client_secret: ${auth.params.clients.algashop-ecommerce-web.secret}
              client-name: Algashop Ecommerce
              authorization-grant-types:
                - authorization_code
                - refresh_token # habilita o refresh
              client-authentication-methods:
                - client_secret_basic
              redirect-uris: ${auth.params.clients.algashop-ecommerce-web.redirect-uris}
              post-logout-redirect-uris: ${auth.params.clients.algashop-ecommerce-web.post-logout-redirect-uris}
              scopes:
                - credit-cards:read
                - credit-cards:write
                - orders:read
                - orders:write
                - customers:read
                - customers:write
                - shopping-carts:read
                - shopping-carts:write
                - invoices:read
                - openid
            require-authorization-consent: false # desativa o consent já que é um client nosso
            require-proof-key: false
            token:
              # Tres prazos, tres papeis diferentes:
              #   codigo  10m - uso unico e imediato; e so um comprovante de troca
              #   access   5m - o que circula em toda requisicao; curto porque nao revoga
              #   refresh  1h - a duracao da SESSAO da pessoa
              access-token-time-to-live: 5m
              authorization-code-time-to-live: 10m
              refresh-token-time-to-live: 1h
              # Rotacao: cada uso do refresh emite um novo e invalida o anterior. Se um
              # refresh vazar, o uso pelo atacante ou pelo dono derruba o do outro, e a
              # anomalia fica detectavel.
              #
              # ATENCAO ao PLURAL: a propriedade e reuse-refresh-tokenS. No singular ela e
              # ignorada em silencio e vale o default do Spring, que e REUSAR. Verificado
              # com o singular: renovar devolvia o MESMO refresh e o antigo continuava
              # valendo - o oposto do que a configuracao dizia fazer.
              reuse-refresh-tokens: false
          # O par do web: o que a loja precisa fazer SEM ninguem logado - listar produto,
          # listar categoria - e o cadastro inicial do cliente (customers:write), que
          # acontece antes de existir usuario para autenticar.
          algashop-ecommerce-m2m-client: # cliente publica, para exibir produtos e categorias sem autenticação de user
            registration:
              client-id: algashop-ecommerce-m2m
              authorization-grant-types:
                - client_credentials
              client-authentication-methods:
                - client_secret_basic
              client_secret: ${auth.params.clients.algashop-ecommerce-m2m.secret}
              scopes: # granulização de scopes (permissão de acesso ao sistema)
                - products:read
                - categories:read
                - users:write
                - shipping-costs:preview
            token:
              access-token-time-to-live: 15m
          algashop-admin-web-client:
            registration:
              client-id: algashop-admin-web
              client-name: AlgaShop Admin
              authorization-grant-types:
                - authorization_code
              client-authentication-methods:
                - none # Client público sem autenticação, precisa do pkce
              redirect-uris: ${auth.params.clients.algashop-admin-web.redirect-uris} # inclui o callback do postman, permite logar via navegador
              post-logout-redirect-uris: ${auth.params.clients.algashop-admin-web.post-logout-redirect-uris}
              scopes:
                - products:read
                - products:write
                - products:stock:write
                - categories:read
                - categories:write
                - invoices:read
                - orders:read
                - customers:read
                - shopping-carts:read
                - users:read
                - users:write
                - openid
            require-authorization-consent: false
            require-proof-key: true #PKCE
            token:
              access-token-time-to-live: 5m
              authorization-code-time-to-live: 2m
          algashop-notifications-service-client:
            registration:
              client-id: algashop-notifications-service
              authorization-grant-types:
                - client_credentials
              client-authentication-methods:
                - client_secret_basic
              client_secret: ${auth.params.clients.algashop-notifications-service.secret}
              scopes:
                - emails:send
                - email-templates:read
                - email-templates:write
            token:
              access-token-time-to-live: 1h
              access-token-format: self-contained # JWT
algashop:
  user-account:
    token:
      activation-ttl: PT24H # tempo de expiration email token
      password-reset-ttl: PT2H # tempo de expiration password reset token
    mail:
      from: ${auth.params.user-account.mail.from} # remetente
      password-change-url: ${auth.params.user-account.password-change-url} # url de troca de senha
  security:
    defaultRedirectUri: ${auth.params.security.defaultRedirectUri} # uri padrão após login
    cors:
      allowedOrigins: ${auth.params.security.cors.allowedOrigins}
    cookie:
      secure: ${auth.params.security.cookie.secure} # HTTPS em prod deve ser true
      sameSite: ${auth.params.security.cookie.sameSite} # None, Lax, Strict -> permite que o cookie seja acessado por outros subdomains
      domainName: ${auth.params.security.cookie.domainName}
    csp: # side refresh pelo client
      policyDirectives: ${auth.params.security.csp.policyDirectives}

logging:
  level:
    org.springframework.security: ${auth.params.logging.security-level}
    com.netflix.discovery.DiscoveryClient: OFF # desativa error eureka em dev
    com.netflix.discovery: OFF
    com.netflix.eureka: OFF

management:
  info:
    env.enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,env
  endpoint:
    health:
      show-details: always
    env:
      show-values: always

eureka:
  client:
    serviceUrl:
      defaultZone: ${shared.params.service-registry-url}/eureka
    healthcheck:
      enabled: true # habilita o health em eureka para status de serviço dentro de eureka
  instance:
    instanceId: ${random.uuid} # cada instancia replicada ganha um id unico
    prefer-ip-address: true # configura rede alcançável via docker