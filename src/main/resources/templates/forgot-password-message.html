<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <title>AlgaShop - Forgot Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css"/>
</head>
<body>
<div class="container">
    <div class="wrapper">
        <div class="title">
            <div class="header-logo">
                <a href="/" class="logo">
                    <img src="/img/logo.png" alt="AlgaShop">
                </a>
            </div>
        </div>
        <div class="message-content">
            <div class="message-icon">
                <i class="fas fa-envelope"></i>
            </div>
            <!--
              A mensagem e DELIBERADAMENTE vaga: ela e a mesma para e-mail cadastrado e
              nao cadastrado. Confirmar "enviamos para voce" so quando a conta existe
              transformaria esta tela num oraculo de enumeracao de usuarios - mesma razao
              pela qual o login responde igual para senha errada e usuario inexistente.
            -->
            <p>If an account exists for that address, we have sent a link to change the password.</p>
            <p>Check your inbox and follow the instructions.</p>
            <div class="back-link">
                <a th:href="@{/login}">Back to Login</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
