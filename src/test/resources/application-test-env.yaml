# Conexao NAO se declara aqui: o @ServiceConnection do TestContainerPostgresSQLConfig
# injeta url, usuario e senha do container efemero. Qualquer spring.datasource.* fixo
# seria sobreposto por ele e so confundiria o leitor.
#
# As tres linhas vazias de flyway (url/user/password) existem para DESFAZER o que o
# development-env declara. O Flyway do Spring Boot usa spring.flyway.url quando ela
# existe, e so cai no datasource quando nao existe - e o development-env aponta para
# localhost:5433/authorization_server, o banco de DESENVOLVIMENTO. Sem anular aqui,
# rodar a suite migraria o banco real: os testes usariam o Postgres do container e o
# Flyway mexeria em outro lugar.
#
# Anular com valor vazio (nao com "" nem com uma url falsa) e o que faz o Boot tratar a
# propriedade como ausente e o Flyway herdar o datasource do container.
#
# O locations tambem e sobrescrito, pelo mesmo motivo de isolamento: o development-env
# inclui classpath:db/testdata, cujo afterMigrate.sql insere 3 usuarios de seed. O
# Flyway roda FORA da transacao do teste, entao o rollback do @Transactional nao desfaz
# o seed - e os ITs de listagem/paginacao contariam usuarios que nao criaram. A troca
# por db/clean segue o padrao do ordering: o afterMigrate de la e substituido por um
# TRUNCATE CASCADE, e o banco de teste nasce limpo.
# Ver src/test/resources/db/clean/afterMigrate.sql
spring:
  # Sem spring.mail.host o MailSenderAutoConfiguration nao entra e nao existe JavaMailSender -
  # e o AuthUserMailSenderImpl (Fase 30) nao consegue ser construido, derrubando o contexto.
  # Aponta para uma porta que nao responde: nenhum teste envia e-mail, so precisa do bean.
  mail:
    host: localhost
    port: 1025
  application:
    name: authorization_server
  datasource:
    url: jdbc:postgresql://localhost:5433/authorization_server_test
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: 'true'
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: postgres
    password: postgres
    url: jdbc:postgresql://localhost:5433/authorization_server_test

# O AlgaShopSecurityProperties e @Validated com @NotNull em cors, csp e cookie, e essas
# propriedades so existem no development-env - que o grupo de perfis 'test' nao carrega.
# Como CorsConfig e CookieConfig sao @Configuration component-scaneados, eles entram no
# contexto de teste e exigem o bean: sem as linhas abaixo, TODO teste que sobe contexto
# morre na validacao, longe da causa.
#
# Os valores sao de teste e nao precisam corresponder a ambiente nenhum - o que importa
# e que existam. Declara-los aqui (em vez de dar default na classe) preserva o que a
# validacao existe para fazer: quebrar cedo quando alguem esquecer de configurar CORS
# ou CSP num ambiente de verdade.
algashop:
  # Sexta vez que uma propriedade obrigatoria nova no development-env derruba o perfil de
  # teste (fases 19, 21, 22, 26, 28, 30). Os valores nao precisam ser reais - so existir.
  user-account:
    token:
      activation-ttl: PT24H
      password-reset-ttl: PT2H
    mail:
      from: AlgaShop <no-reply@algashop.test>
      password-change-url: http://localhost:9000/change-password
  security:
    # Quinta vez que uma propriedade obrigatoria nova no development-env derruba o perfil de
    # teste (fases 19, 21, 22, 26, 28). O valor aqui e irrelevante - so precisa existir, e o
    # @NotBlank existe justamente para quebrar cedo quem esquecer de configura-la a serio.
    defaultRedirectUri: http://localhost:9080
    cors:
      allowedOrigins:
        - http://localhost:4200
    cookie:
      secure: false
      sameSite: Lax
      domainName: localhost
    csp:
      policyDirectives: "frame-ancestors 'self'"
