plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.springframework.cloud.contract' version '5.0.0'
}

group = 'com.algaworks.algashop'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.1.0")
}

configurations {
	// mockitoAgent: escopo só para resolver o JAR do Mockito e passá-lo como -javaagent.
	// A partir do JDK 21 o "self-attach" de agente é desencorajado (e no 24 falha), então
	// o Mockito precisa ser carregado explicitamente como agente na JVM de teste.
	// transitive = false: queremos o JAR do mockito-core sozinho, não a árvore de dependências.
	mockitoAgent { transitive = false }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.session:spring-session-jdbc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'com.fasterxml.uuid:java-uuid-generator:5.2.0'

    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // Postgres efemero nos testes, no mesmo padrao dos outros tres servicos: o
    // contextLoads passou a precisar de banco quando o armazenamento de token entrou,
    // e depender de infraestrutura externa faria a suite so rodar em quem tem o
    // compose de pe. De quebra, as migrations passam a ser exercitadas do zero.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server-test'
	testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-verifier'
	testImplementation 'io.rest-assured:spring-mock-mvc:6.0.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	mockitoAgent 'org.mockito:mockito-core'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

contracts {
	packageWithBaseClasses = "com.algaworks.algashop.authorizationserver.contract.base"
}

// Três suítes separadas, uma por tipo de teste:
//   test            -> unitários e de fatia, rodam sozinhos (é o que roda no dia a dia)
//   contractTest    -> gerados pelo Spring Cloud Contract a partir dos .groovy
//   integrationTest -> classes *IT, exigem infraestrutura de pé (Docker/Testcontainers)
// 'check' amarra as três, então ./gradlew check (ou build) valida tudo de uma vez.
tasks.named('check') {
	dependsOn(test, contractTest, integrationTest)
}

tasks.named('contractTest') {
	useJUnitPlatform()
}

tasks.named('test') {
	useJUnitPlatform()
}

test {
	// tira os *IT daqui: ./gradlew test tem que passar sem nenhum container de pé
	//
	// failOnNoMatchingTests: hoje o servico nao tem teste unitario/de fatia proprio -
	// o contextLoads foi aposentado porque exigia Docker (Testcontainers) dentro da
	// suite que promete rodar sem container, e a subida do contexto ja e validada pelo
	// AuthUserQueryServiceIT. Sem esta flag, o Gradle falha a task quando o filtro
	// nao encontra teste nenhum ("No tests found for given includes").
	filter {
		excludeTestsMatching("*IT")
		failOnNoMatchingTests = false
	}
	failOnNoDiscoveredTests = false
	jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
}

// Mesmo código-fonte de teste (src/test), separado só pelo sufixo da classe.
// Não precisa de source set próprio — o filtro por nome já resolve.
tasks.register('integrationTest', Test) {
	description = 'Run integration tests.'
	group = 'verification'
	jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"

	// reaproveita os .class e o classpath compilados pelo source set de teste
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	// ordem, não dependência: se as duas rodarem, os unitários vêm primeiro —
	// falha barata aparece antes de gastar tempo com a suíte que precisa de infra
	shouldRunAfter test

	useJUnitPlatform()

	testLogging {
		events "passed"
	}

	// o espelho do filtro do 'test': aqui só entram os *IT
	filter {
		includeTestsMatching "*IT"
		excludeTestsMatching "*Test"
	}
}
